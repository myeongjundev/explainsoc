name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치면 차례로 돈다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Privacy and secret scan (source)
        run: npm run check

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      # 빌드가 생긴 뒤 다시 돌면 배포본의 외부 주소·글꼴·보안 정책까지 본다.
      - name: Privacy and secret scan (build)
        run: npm run check

      - name: Dependency audit
        run: npm audit --audit-level=high

      # 브라우저는 버전마다 경로가 달라서 버전을 키에 넣는다.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # 60초 예시·세 행동·잘못된 입력·키보드·화면 폭·접근성(axe)·요청과 저장소
      - name: Browser tests
        run: npm run test:e2e

      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
